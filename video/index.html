<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Mechanism of Action — EP2/IP/DP1 → Gs → AC → cAMP</title>
<style>
  html,body{margin:0;padding:0;background:#04121c;}
  #app{
    position:relative;
    width:1920px;
    height:1080px;
    overflow:hidden;
    background:linear-gradient(180deg,
      #bfe9f2 0%,
      #8fd0e0 8%,
      #2e6f86 42%,
      #123a4d 55%,
      #071e2b 78%,
      #030f18 100%);
    font-family:'Segoe UI', Helvetica, Arial, sans-serif;
  }
  #c{
    position:absolute;
    top:0; left:0;
    width:1920px; height:1080px;
    display:block;
  }
  .zone-tag{
    position:absolute;
    left:36px;
    font-size:22px;
    letter-spacing:3px;
    text-transform:uppercase;
    color:rgba(255,255,255,0.55);
    font-weight:600;
  }
  #tag-extra{ top:28px; }
  #tag-cyto{ bottom:28px; }

  #labels{ position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; }
  .obj-label{
    position:absolute;
    transform:translate(-50%,-50%);
    color:#ffffff;
    font-size:26px;
    font-weight:700;
    text-shadow:0 2px 8px rgba(0,0,0,0.85), 0 0 4px rgba(0,0,0,0.6);
    white-space:nowrap;
    opacity:0;
    transition:none;
  }
  .obj-label.sub{
    font-size:18px;
    font-weight:400;
    color:#dff2f7;
  }

  #caption{
    position:absolute;
    left:50%;
    bottom:130px;
    transform:translateX(-50%);
    color:#ffffff;
    font-size:38px;
    font-weight:600;
    text-align:center;
    text-shadow:0 2px 10px rgba(0,0,0,0.8);
    opacity:0;
    max-width:1400px;
  }
  #caption .small{
    display:block;
    font-size:22px;
    font-weight:400;
    color:#cfeaf2;
    margin-top:8px;
  }

  #titlecard{
    position:absolute;
    top:0;left:0;width:100%;height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    background:#04121c;
    opacity:0;
  }
  #titlecard h1{
    color:#ffffff;
    font-size:58px;
    font-weight:700;
    margin:0 0 14px 0;
    letter-spacing:1px;
  }
  #titlecard h2{
    color:#7fd7e8;
    font-size:26px;
    font-weight:400;
    margin:0;
    letter-spacing:4px;
    text-transform:uppercase;
  }

  #outro{
    position:absolute;
    top:0;left:0;width:100%;height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    background:#04121c;
    opacity:0;
  }
  #outro .flow{
    display:flex;
    align-items:center;
    gap:18px;
    flex-wrap:wrap;
    justify-content:center;
    max-width:1600px;
    padding:0 60px;
  }
  #outro .step{
    color:#ffffff;
    font-size:28px;
    font-weight:600;
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.25);
    border-radius:10px;
    padding:16px 22px;
  }
  #outro .arrow{ color:#7fd7e8; font-size:28px; }
  #outro h2{
    color:#7fd7e8;
    font-size:24px;
    font-weight:400;
    letter-spacing:3px;
    text-transform:uppercase;
    margin-bottom:34px;
  }

  #meter{
    position:absolute;
    right:60px;
    top:120px;
    width:64px;
    height:340px;
    border:2px solid rgba(255,255,255,0.55);
    border-radius:10px;
    overflow:hidden;
    opacity:0;
    background:rgba(255,255,255,0.05);
  }
  #meter-fill{
    position:absolute;
    bottom:0;left:0;width:100%;
    height:0%;
    background:linear-gradient(180deg,#ffd76a,#f7a83c);
  }
  #meter-label{
    position:absolute;
    right:60px;
    top:70px;
    width:200px;
    text-align:center;
    color:#ffe7b3;
    font-size:20px;
    font-weight:700;
    letter-spacing:1px;
    opacity:0;
  }
</style>
</head>
<body>
  <div id="app">
    <canvas id="c" width="1920" height="1080"></canvas>
    <div id="tag-extra" class="zone-tag">Extracellular space</div>
    <div id="tag-cyto" class="zone-tag">Cytoplasm</div>
    <div id="labels"></div>
    <div id="meter-label">cAMP</div>
    <div id="meter"><div id="meter-fill"></div></div>
    <div id="caption"></div>
    <div id="titlecard">
      <h1>Mechanism of Action</h1>
      <h2>EP2 / IP / DP1 receptor agonism</h2>
    </div>
    <div id="outro">
      <h2>Pathway summary</h2>
      <div class="flow">
        <div class="step">EP2 / IP / DP1 agonism</div>
        <div class="arrow">&#8594;</div>
        <div class="step">Gs protein activation</div>
        <div class="arrow">&#8594;</div>
        <div class="step">Adenylate cyclase</div>
        <div class="arrow">&#8594;</div>
        <div class="step">ATP &#8594; cAMP</div>
        <div class="arrow">&#8594;</div>
        <div class="step">&#8593; Intracellular cAMP</div>
        <div class="arrow">&#8594;</div>
        <div class="step">Antifibrotic effect</div>
      </div>
    </div>
  </div>
  <script type="importmap">
    { "imports": { "three": "./vendor/three.module.min.js" } }
  </script>
  <script type="module" src="./scene.js"></script>
</body>
</html>
